<!DOCTYPE html>

<html lang="ru" data-site data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1310">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Проводник по авиатренажёру</title>
<style>
/* Layout: centered wizard — track tabs, progress rail, phone-mock stage beside step text, prev/next. */
:root{
  --bg:#f2f6f4; --surface:#ffffff; --surface-2:#e8efeb; --line:#d4ddd8;
  --fg:#14201c; --muted:#596a64; --accent:#0f7a56; --accent-2:#0b5e43; --accent-ink:#ffffff;
  --warn:#c0564d; --ok:#0f7a56;
  /* mock app screen — always the real app's dark aviation palette, in both themes */
  --app-bg:#0e1b17; --app-panel:#14261f; --app-panel2:#1a332b; --app-line:#28463b;
  --app-fg:#eaf3ef; --app-muted:#9fb8b0; --app-accent:#1fae84; --app-ink:#04140f;
  --r:16px; --r-sm:11px;
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0b1310; --surface:#111e19; --surface-2:#16251f; --line:#233831;
  --fg:#e8f1ed; --muted:#9bb2a9; --accent:#2fbd90; --accent-2:#53d6ab; --accent-ink:#04140f;
  --warn:#ff7d72; --ok:#2fbd90; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1310; --surface:#111e19; --surface-2:#16251f; --line:#233831;
  --fg:#e8f1ed; --muted:#9bb2a9; --accent:#2fbd90; --accent-2:#53d6ab; --accent-ink:#04140f;
  --warn:#ff7d72; --ok:#2fbd90; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding-inline:18px;padding-block:22px 40px}
.back{display:inline-block;margin-bottom:14px;color:var(--accent);font-weight:600;font-size:14px;
  text-decoration:none}
.back:hover{text-decoration:underline}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

/* ---- header ---- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(15,122,86,.3)}
.logo svg{width:22px;height:22px;fill:var(--accent-ink)}
.ttl{font-family:var(--font-display);font-weight:700;font-size:clamp(19px,4.6vw,24px);
  letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.theme{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:17px;
  display:grid;place-items:center}
.theme:hover{color:var(--fg);border-color:var(--accent)}

/* ---- track tabs ---- */
.tabs{display:flex;gap:8px;background:var(--surface-2);padding:5px;border-radius:14px;
  border:1px solid var(--line);margin-bottom:18px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font-family:var(--font-body);
  font-weight:600;font-size:14.5px;padding:10px 8px;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;transition:all .18s}
.tab b{font-weight:700}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);
  box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tab .ic{font-size:16px}

/* ---- progress ---- */
.rail{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.dots{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.dot{width:26px;height:6px;border-radius:99px;background:var(--line);border:0;padding:0;cursor:pointer;
  transition:background .2s,width .2s}
.dot.done{background:var(--accent)}
.dot.now{background:var(--accent);width:40px}
.count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;
  font-family:var(--font-mono)}

/* ---- stage ---- */
.stage{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:24px;min-height:430px}
@media (max-width:620px){ .stage{grid-template-columns:1fr;gap:18px;padding:18px;text-align:center} }

.stepwrap{animation:fade .34s ease both}
.reduce .stepwrap{animation:none}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin-bottom:8px}
.stitle{font-family:var(--font-display);font-weight:700;font-size:clamp(20px,5vw,26px);
  letter-spacing:-.02em;line-height:1.12;text-wrap:balance;margin:0 0 10px}
.sdesc{font-size:15.5px;color:var(--fg);margin:0 0 14px;max-width:46ch}
@media (max-width:620px){ .sdesc{margin-inline:auto} }
.note{display:flex;gap:9px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:11px 13px;font-size:13.5px;color:var(--muted);text-align:left;
  max-width:46ch}
@media (max-width:620px){ .note{margin-inline:auto} }
.note.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));
  background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.note .nic{flex:none;font-size:15px;line-height:1.3}

/* ---- phone mock ---- */
.phone{justify-self:center;width:218px;flex:none}
@media (max-width:620px){ .phone{width:200px} }
.frame{position:relative;background:#05100c;border-radius:30px;padding:9px;
  box-shadow:0 12px 34px rgba(0,0,0,.28),inset 0 0 0 1.5px #0b1b15}
.frame::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:62px;height:5px;border-radius:99px;background:#0b1b15;z-index:3}
.scr{background:var(--app-bg);border-radius:22px;overflow:hidden;height:378px;position:relative;
  color:var(--app-fg);font-size:12px;display:flex;flex-direction:column}
.scr-top{display:flex;align-items:center;gap:7px;padding:16px 13px 10px}
.scr-logo{width:20px;height:20px;border-radius:6px;background:var(--app-accent);display:grid;
  place-items:center;flex:none}
.scr-logo svg{width:13px;height:13px;fill:var(--app-ink)}
.scr-brand b{font-size:11.5px;display:block;line-height:1.1}
.scr-brand span{font-size:8.5px;color:var(--app-muted)}
.scr-body{padding:4px 13px 13px;flex:1;overflow:hidden;display:flex;flex-direction:column;gap:9px}
.scr-lead{font-size:10px;color:var(--app-muted);line-height:1.45}
.mcard{background:var(--app-panel);border:1px solid var(--app-line);border-radius:12px;padding:11px}
.mrow{display:flex;align-items:center;gap:9px;background:var(--app-panel);border:1px solid var(--app-line);
  border-radius:11px;padding:9px 11px}
.mrow .mi{width:22px;height:22px;border-radius:7px;background:var(--app-panel2);display:grid;
  place-items:center;flex:none;font-size:12px}
.mrow b{font-size:10.5px;font-weight:600}
.mrow span{font-size:8.5px;color:var(--app-muted);display:block}
.mrow.hl{border-color:var(--app-accent);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--app-accent) 55%,transparent)}
.mmodes{display:flex;gap:7px}
.mmode{flex:1;text-align:center;padding:9px;border-radius:10px;border:1px solid var(--app-line);
  background:var(--app-panel);font-size:11px;font-weight:600;color:var(--app-muted)}
.mmode.on{background:var(--app-accent);color:var(--app-ink);border-color:var(--app-accent)}
.mfield{font-size:8.5px;color:var(--app-muted)}
.mfield .inp{margin-top:4px;background:var(--app-panel2);border:1px solid var(--app-line);
  border-radius:9px;padding:8px 9px;font-size:9.5px;color:var(--app-fg);display:flex;
  align-items:center;justify-content:space-between}
.mfield .inp.sel{border-color:var(--app-accent)}
.mbtn{background:var(--app-accent);color:var(--app-ink);text-align:center;font-weight:700;
  font-size:11px;padding:11px;border-radius:11px}
.mbtn.ghost{background:transparent;border:1px solid var(--app-line);color:var(--app-muted);font-weight:600}
.mhead{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--app-muted)}
.chip{background:var(--app-panel2);border:1px solid var(--app-line);border-radius:99px;
  padding:3px 8px;font-size:8.5px;font-weight:600}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--app-line))}
.chip.ok{color:var(--app-accent)}
.bar{height:5px;background:var(--app-panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--app-accent);border-radius:99px}
.code{font-family:var(--font-mono);letter-spacing:.32em;font-size:20px;font-weight:700;
  color:var(--app-accent);text-align:center}
.dict{font-family:var(--font-mono);letter-spacing:.3em;font-weight:700}
/* telegram bubble */
.tg{background:#17212b;border-radius:12px;padding:10px 11px;font-size:9.5px;line-height:1.5;
  border:1px solid #223344}
.tg .tgh{color:#6ab3f3;font-weight:700;font-size:9.5px;margin-bottom:3px}
.tg b{color:#eaf3ef}
.tg .k{color:var(--app-accent);font-weight:700}
.speech{background:var(--app-accent);color:var(--app-ink);border-radius:12px;border-bottom-left-radius:3px;
  padding:9px 11px;font-size:10.5px;font-weight:600;align-self:flex-start;max-width:85%}
/* result ring */
.ring{display:grid;place-items:center;margin:2px auto 0}
.ring svg{width:92px;height:92px}
.ring .pct{font-family:var(--font-display);font-weight:700}
/* tap pulse */
.tap{position:absolute;width:30px;height:30px;border-radius:99px;border:2px solid var(--app-accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--app-accent) 30%,transparent);
  animation:tap 1.5s ease-out infinite;pointer-events:none;z-index:4}
.reduce .tap{animation:none}
.mrow,.mmode,.mfield,.mbtn{position:relative}   /* кружок-подсказка стоит на своём элементе */
.mmode .tap,.mbtn .tap{border-color:var(--app-fg);box-shadow:0 0 0 3px rgba(234,243,239,.3)}
@keyframes tap{0%{transform:scale(.6);opacity:1}70%{transform:scale(1.25);opacity:.25}100%{transform:scale(1.35);opacity:0}}

/* ---- nav ---- */
.nav{display:flex;align-items:center;gap:12px;margin-top:18px}
.btn{font-family:var(--font-body);font-weight:700;font-size:15px;border-radius:12px;padding:13px 20px;
  cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);transition:all .15s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);margin-left:auto}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.primary.done{background:var(--surface);color:var(--accent);border-color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,.dot:focus-visible,.theme:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot{margin-top:22px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6}
.foot code{font-family:var(--font-mono);background:var(--surface-2);border:1px solid var(--line);
  border-radius:6px;padding:1px 6px;font-size:11.5px;color:var(--fg)}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap">

<div class="wrap">
  <a class="back" id="back" href="https://bsheraliev.github.io/subp-trainer/" target="_blank" rel="noopener">Открыть приложение ↗</a>
  <header class="top">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3zm-1 14-4-4 1.4-1.4L11 13.2l4.6-4.6L17 10l-6 6z"/></svg></span>
    <div>
      <div class="ttl">Как проходить экзамен</div>
      <div class="sub">Авиатренажёр СУБП · пошагово</div>
    </div>
    <button class="theme" id="theme" aria-label="Сменить тему">◐</button>
  </header>

  <div class="tabs" role="tablist" aria-label="Для кого">
    <button class="tab" id="tab-candidate" role="tab" aria-selected="true" aria-controls="stage"><span class="ic">🎓</span> Я <b>сдаю</b></button>
    <button class="tab" id="tab-examiner" role="tab" aria-selected="false" aria-controls="stage"><span class="ic">✈️</span> Я <b>принимаю</b></button>
  </div>

  <div class="rail">
    <div class="dots" id="dots"></div>
    <div class="count" id="count"></div>
  </div>

  <section class="stage" id="stage">
    <div class="phone"><div class="frame"><div class="scr" id="screen"></div></div></div>
    <div class="stepwrap" id="stepwrap">
      <div class="eyebrow" id="eyebrow"></div>
      <h2 class="stitle" id="stitle"></h2>
      <p class="sdesc" id="sdesc"></p>
      <div id="noteSlot"></div>
    </div>
  </section>

  <div class="nav">
    <button class="btn" id="prev">← Назад</button>
    <button class="btn primary" id="next">Дальше →</button>
  </div>

  <p class="foot">
    Приложение: <code>bsheraliev.github.io/subp-trainer</code><br>
    Эта инструкция: <code>bsheraliev.github.io/subp-trainer/guide.html</code> — открывается по ссылке без входа, в том числе на телефоне.
  </p>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const APPLOGO='<svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3zm-1 14-4-4 1.4-1.4L11 13.2l4.6-4.6L17 10l-6 6z"/></svg>';
function appTop(sub){return `<div class="scr-top"><div class="scr-logo">${APPLOGO}</div><div class="scr-brand"><b>Авиатренажёр</b><span>${sub||'СУБП · Человеческий фактор'}</span></div></div>`;}
function body(inner){return `<div class="scr-body">${inner}</div>`;}
function tap(pos){return `<span class="tap" style="${pos||'right:8px;top:50%;margin-top:-15px'}"></span>`;}

const TRACKS={
candidate:[
 {eye:'Шаг 1',t:'Откройте приложение',d:'Зайдите по ссылке или с ярлыка на телефоне. Тренажёр работает офлайн и ставится как обычное приложение.',
  note:['📲','Один раз нажмите «Установить» — появится иконка на экране, интернет дальше не нужен.'],
  scr:appTop()+body(`<div class="scr-lead">Выберите предмет тестирования.</div>
   <div class="mrow hl"><span class="mi">🛡️</span><div><b>СУБП</b><span>Управление безопасностью полётов</span></div></div>
   <div class="mrow"><span class="mi">🧠</span><div><b>Человеческий фактор</b><span>Психология, ошибки, эргономика</span></div></div>
   <div class="mcard" style="margin-top:auto;text-align:center;font-size:9px;color:var(--app-muted)">bsheraliev.github.io/subp-trainer</div>`)},
 {eye:'Шаг 2',t:'Выберите предмет',d:'СУБП (система управления безопасностью полётов) или Человеческий фактор — смотря по чему экзамен.',
  scr:appTop()+body(`<div class="scr-lead">Выберите предмет тестирования.</div>
   <div class="mrow hl"><span class="mi">🛡️</span><div><b>СУБП</b><span>ИКАО Прил. 19</span></div>${tap()}</div>
   <div class="mrow"><span class="mi">🧠</span><div><b>Человеческий фактор</b><span>ИКАО Doc 9683</span></div></div>
   <div class="mrow"><span class="mi">📋</span><div><b>Журнал прохождений</b></div></div>`)},
 {eye:'Шаг 3',t:'Переключитесь на «Экзамен»',d:'Тренажёр — учиться без ограничений. Экзамен — с оценкой, лимитом времени и справкой о прохождении.',
  note:['🎯','Для аттестации нужен именно режим «Экзамен».'],
  scr:appTop('СУБП')+body(`<div class="mmodes"><div class="mmode">Тренажёр</div><div class="mmode on">Экзамен${tap()}</div></div>
   <div class="scr-lead">Экзамен: 25 вопросов · лимит времени · проходной 75%.</div>
   <div class="mrow"><span class="mi">🗼</span><div><b>Диспетчеры УВД</b></div></div>
   <div class="mrow"><span class="mi">✈️</span><div><b>Лётный экипаж</b></div></div>
   <div class="mrow"><span class="mi">🧳</span><div><b>Бортпроводники</b></div></div>`)},
 {eye:'Шаг 4',t:'Выберите свою категорию',d:'Нажмите категорию персонала, по которой сдаёте: диспетчер, лётный экипаж, бортпроводник, аэропорт и т. д.',
  scr:appTop('СУБП')+body(`<div class="mmodes"><div class="mmode">Тренажёр</div><div class="mmode on">Экзамен</div></div>
   <div class="scr-lead">Категория персонала</div>
   <div class="mrow"><span class="mi">🗼</span><div><b>Диспетчеры УВД</b></div></div>
   <div class="mrow hl"><span class="mi">✈️</span><div><b>Лётный экипаж</b></div>${tap()}</div>
   <div class="mrow"><span class="mi">🧳</span><div><b>Бортпроводники</b></div></div>
   <div class="mrow"><span class="mi">🛫</span><div><b>Персонал аэропорта</b></div></div>`)},
 {eye:'Шаг 5',t:'Введите данные',d:'ФИО, организацию (выбрать из списка) и подразделение/должность. По организации результат попадёт в нужную компанию.',
  note:['🏢','«Организация» — это выпадающий список: АГА, Сомон Эйр, Шохин Эйр, аэропорты и др. Нет в списке — «Другая организация…».'],
  scr:appTop('Данные для экзамена')+body(`
   <div class="mfield">Фамилия, имя, отчество<div class="inp">Иванов Иван Иванович</div></div>
   <div class="mfield">Организация / компания<div class="inp sel">Сомон Эйр (Somon Air) ▾</div>${tap('right:8px;bottom:0')}</div>
   <div class="mfield">Подразделение / должность<div class="inp">Лётный отряд</div></div>
   <div class="mbtn" style="margin-top:4px">Начать экзамен</div>`)},
 {eye:'Шаг 6',t:'Запросите код',d:'Нажмите «Начать экзамен». Экзаменатору тут же придёт персональный код — экзамен не начнётся без него.',
  note:['🔒','Так исключается сдача без ведома экзаменатора.'],
  scr:appTop('Данные для экзамена')+body(`
   <div class="mfield">Фамилия, имя, отчество<div class="inp">Иванов Иван Иванович</div></div>
   <div class="mfield">Организация / компания<div class="inp">Сомон Эйр (Somon Air)</div></div>
   <div class="mbtn">Начать экзамен${tap()}</div>
   <div class="mcard" style="font-size:9px;color:var(--app-muted);line-height:1.5">Запрос <b style="color:var(--app-fg)">№R482</b> отправлен экзаменатору. Получите код и введите ниже.</div>`)},
 {eye:'Шаг 7',t:'Введите код от экзаменатора',d:'Экзаменатор продиктует код. Введите его и нажмите «Подтвердить и начать». Код действует 15 минут.',
  scr:appTop('Данные для экзамена')+body(`
   <div class="tg"><div class="tgh">Экзаменатор</div>Ваш код — <b>4 8 2 7</b></div>

let track='candidate', i=0;
const stepwrap=$('#stepwrap');

function render(animate){
  const steps=TRACKS[track], s=steps[i];
  $('#tab-candidate').setAttribute('aria-selected',track==='candidate');
  $('#tab-examiner').setAttribute('aria-selected',track==='examiner');
  // dots
  $('#dots').innerHTML=steps.map((_,k)=>`<button class="dot ${k<i?'done':''} ${k===i?'now':''}" data-k="${k}" aria-label="Шаг ${k+1}"></button>`).join('');
  $('#count').textContent=`${i+1} / ${steps.length}`;
  // screen
  $('#screen').innerHTML=s.scr;
  // text (re-trigger animation)
  if(animate!==false){ stepwrap.style.animation='none'; void stepwrap.offsetWidth; stepwrap.style.animation=''; }
  $('#eyebrow').textContent=s.eye;
  $('#stitle').textContent=s.t;
  $('#sdesc').textContent=s.d;
  $('#noteSlot').innerHTML = s.note ? `<div class="note ${s.note[2]?'warn':''}"><span class="nic">${s.note[0]}</span><span>${s.note[1]}</span></div>` : '';
  // nav
  $('#prev').disabled=i===0;
  const last=i===steps.length-1;
  const nx=$('#next');
  nx.classList.toggle('done',last);
  nx.textContent = last ? (track==='candidate'?'↻ С начала':'↻ С начала') : 'Дальше →';
  try{localStorage.setItem('subp_guide_track',track);}catch(e){}
}
function go(d){ const n=TRACKS[track].length; i=Math.min(Math.max(0,i+d),n-1); render(); }
function setTrack(t){ if(t===track)return; track=t; i=0; render(); }

$('#next').onclick=()=>{ if(i===TRACKS[track].length-1){ i=0; render(); } else go(1); };
$('#prev').onclick=()=>go(-1);
$('#tab-candidate').onclick=()=>setTrack('candidate');
$('#tab-examiner').onclick=()=>setTrack('examiner');
$('#dots').onclick=e=>{ const d=e.target.closest('.dot'); if(d){ i=+d.dataset.k; render(); } };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight')go(1); else if(e.key==='ArrowLeft')go(-1); });

// theme toggle
const root=document.documentElement;
(function(){ try{ const t=localStorage.getItem('subp_guide_theme'); if(t)root.setAttribute('data-theme',t);}catch(e){} })();
$('#theme').onclick=()=>{
  const cur=root.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark';
  root.setAttribute('data-theme',nx);
  try{localStorage.setItem('subp_guide_theme',nx);}catch(e){}
};

// reduced motion
if(matchMedia('(prefers-reduced-motion:reduce)').matches) document.body.classList.add('reduce');

// Копия на сайте приложения: её собирает build-guide.mjs и ставит data-site на <html>.
const SITE = root.hasAttribute('data-site');
const EMBED = SITE && window.self !== window.top;   // открыта поверх приложения
(function(){
  if(!SITE) return;                                  // на claude.ai остаётся внешняя ссылка на приложение
  const b=$('#back');
  if(EMBED){ b.hidden=true; document.body.classList.add('embedded'); return; }   // закрывает кнопка приложения
  b.href='./'; b.removeAttribute('target'); b.removeAttribute('rel'); b.textContent='← В приложение';
})();

// Адрес с меткой: #candidate, #examiner, #candidate-5 (сразу нужный шаг)
function applyHash(){
  const m=(location.hash||'').replace('#','').match(/^(candidate|examiner)(?:-(\d+))?$/);
  if(!m) return false;
  track=m[1];
  i=Math.min(Math.max(0,(+m[2]||1)-1), TRACKS[track].length-1);
  return true;
}
window.addEventListener('hashchange',()=>{ if(applyHash()) render(); });
(function(){
  if(!applyHash()){ try{ const t=localStorage.getItem('subp_guide_track'); if(t==='examiner'||t==='candidate')track=t; }catch(e){} }
  render(false);
})();
</script>
